[theme]
base = "light"
font = "sans serif"
primaryColor = "#4f46e5"
backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#eef0f8"
textColor = "#0f172a"
linkColor = "#4f46e5"
borderColor = "#e3e6ef"
showWidgetBorder = true
baseRadius = "0.75rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
